
name: Build Neon GX Browser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build executable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --name NeonGXBrowser
          --collect-all PySide6
          --collect-all shiboken6
          main.py

      - name: Package executable
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/NeonGXBrowser `
            -DestinationPath NeonGXBrowser-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NeonGXBrowser-Windows
          path: NeonGXBrowser-Windows.zip
          if-no-files-found: error
          retention-days: 14
